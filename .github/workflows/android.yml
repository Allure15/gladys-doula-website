name: Build APK
on:
  push:
    branches: [ "claude/**" , main ]
    paths: [ "android-carplay-ui/**", ".github/workflows/android.yml" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-carplay-ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ridgeline-dock-debug
          path: android-carplay-ui/app/build/outputs/apk/debug/*.apk
